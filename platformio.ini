; Pucky — Elecrow CrowPanel 2.1" Rotary Display (DHE03921D)
; ESP32-S3R8: 16 MB quad flash, 8 MB octal PSRAM, native USB, 480x480 round ST7701 RGB panel.
; Board reference: docs/crowpanel-2.1-rotary.md
[platformio]
default_envs = rotary21

[env:rotary21]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions/elecrow_s3.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1            ; native USB-Serial/JTAG
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Serial over that USB port
    -DCORE_DEBUG_LEVEL=2
    -DLV_CONF_INCLUDE_SIMPLE        ; picks up include/lv_conf.h
    -DLV_LVGL_H_INCLUDE_SIMPLE      ; generated icon .c files include "lvgl.h"
    -Iinclude
    -Isrc

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
    lvgl/lvgl@^9.3.0
    bblanchon/ArduinoJson@^7.4.0

monitor_speed = 115200
upload_speed = 921600
